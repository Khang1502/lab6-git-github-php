
name: Deploy PHP to alwaysdata

on:
  push:
    branches: [main]
    paths:
      - 'php-site/**'
      - '.github/workflows/deploy-php.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP syntax
        run: |
          find php-site -name '*.php' -exec php -l {} \;

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./php-site/
          server-dir: ./

     
      
      - name: Verify website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail

          test -n "$SITE_URL"

          expected="$(php php-site/health.php)"

          actual="$(curl --fail --silent --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --max-time 30 \
            -H "Cache-Control: no-cache" \
            "${SITE_URL%/}/health.php?ci=${GITHUB_SHA}")"

          echo "Expected: $expected"
          echo "Actual: $actual"

          test "$actual" = "$expected"

          echo "PHP deployment verified successfully!"

